name: Deploy Weekly Meal Planner Assistant

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ───────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-southeast-1

      # ── 3. Set up Python 3.12 ──────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 4. Set up AWS SAM CLI ──────────────────────────────────────────
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── 5. SAM Build ───────────────────────────────────────────────────
      - name: SAM Build
        run: sam build --template infra/template.yaml

      # ── 6. SAM Deploy ──────────────────────────────────────────────────
      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name weekly-meal-planner-assistant \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # ── 7. Read CloudFormation outputs ────────────────────────────────
      - name: Read CloudFormation outputs
        id: cfn
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name weekly-meal-planner-assistant \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          MEAL_PLAN_URL=$(get_output PersonalizedMealPlanUrl)
          SHOPPING_LIST_URL=$(get_output ConsolidatedShoppingListUrl)
          WEBSITE_URL=$(get_output WebsiteUrl)
          BUCKET_NAME=$(get_output BucketName)

          echo "meal_plan_url=$MEAL_PLAN_URL"         >> "$GITHUB_OUTPUT"
          echo "shopping_list_url=$SHOPPING_LIST_URL" >> "$GITHUB_OUTPUT"
          echo "website_url=$WEBSITE_URL"             >> "$GITHUB_OUTPUT"
          echo "bucket_name=$BUCKET_NAME"             >> "$GITHUB_OUTPUT"

          echo "### CloudFormation Outputs" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |"                    >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|"                    >> "$GITHUB_STEP_SUMMARY"
          echo "| PersonalizedMealPlanUrl    | $MEAL_PLAN_URL     |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ConsolidatedShoppingListUrl | $SHOPPING_LIST_URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| WebsiteUrl  | $WEBSITE_URL  |"   >> "$GITHUB_STEP_SUMMARY"
          echo "| BucketName  | $BUCKET_NAME  |"   >> "$GITHUB_STEP_SUMMARY"

      # ── 8. Inject Lambda URLs into frontend ───────────────────────────
      - name: Inject Lambda URLs into frontend/index.html
        run: |
          URL=${{ steps.cfn.outputs.meal_plan_url }}
          sed -i "s|__URL_PERSONALIZED_MEAL_PLAN__|$URL|g" frontend/index.html

          URL=${{ steps.cfn.outputs.shopping_list_url }}
          sed -i "s|__URL_CONSOLIDATED_SHOPPING_LIST__|$URL|g" frontend/index.html

      # ── 9. Deploy frontend to S3 ──────────────────────────────────────
      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/ \
            s3://${{ steps.cfn.outputs.bucket_name }} \
            --cache-control no-cache \
            --delete

      # ── 10. Print live URL ────────────────────────────────────────────
      - name: Print website URL
        run: |
          echo "✅ Deployed! Website: ${{ steps.cfn.outputs.website_url }}"
          echo "🌐 Website URL: ${{ steps.cfn.outputs.website_url }}" >> "$GITHUB_STEP_SUMMARY"
